name: Página diaria

# Una vez al día basta: la página resume a los proyectos, no compite con ellos. A las 07:40 UTC
# ya han pasado las pasadas nocturnas de casi todos.
on:
  schedule:
    - cron: "40 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  page:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m unittest -v

      - name: Read the projects and write the page
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m terra

      - name: Commit the page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Actualización automática $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash -X theirs origin main
            git push origin HEAD:main
          fi
